name: thumb
# 주제 이미지 배경 썸네일 합성. 클라우드 컨테이너는 이미지 CDN 접근이 막혀 있어 여기서 합성한다.
# 두 가지 트리거:
#  (A) thumb_requests/<name>.json 을 push  → {"out":"batch_../x.png","bg_url":"https://..","spec":{...}}  ← 기본 (GitHub 커넥터 불필요)
#  (B) workflow_dispatch inputs(out, bg_url, spec JSON 문자열)                                       ← 수동/예비
on:
  push:
    paths: ["thumb_requests/*.json"]
  workflow_dispatch:
    inputs:
      out: {description: "출력 PNG 레포 상대경로", required: true}
      bg_url: {description: "배경 이미지 URL", required: false, default: ""}
      spec: {description: "JSON spec", required: true}
permissions:
  contents: write
concurrency:
  group: thumb-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect requests
        id: req
        env:
          EV: ${{ github.event_name }}
          IN_OUT: ${{ inputs.out }}
          IN_BG: ${{ inputs.bg_url }}
          IN_SPEC: ${{ inputs.spec }}
        run: |
          mkdir -p /tmp/req
          if [ "$EV" = "workflow_dispatch" ]; then
            node -e 'const fs=require("fs");fs.writeFileSync("/tmp/req/dispatch.json",JSON.stringify({out:process.env.IN_OUT,bg_url:process.env.IN_BG,spec:JSON.parse(process.env.IN_SPEC)}))'
          else
            ls thumb_requests/*.json >/dev/null 2>&1 && cp thumb_requests/*.json /tmp/req/ || true
          fi
          n=$(ls /tmp/req/*.json 2>/dev/null | wc -l); echo "count=$n" >> "$GITHUB_OUTPUT"; echo "requests: $n"
      - uses: actions/setup-node@v4
        if: steps.req.outputs.count != '0'
        with: {node-version: "22"}
      - name: Fonts + playwright
        if: steps.req.outputs.count != '0'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra >/dev/null
          npm i --no-save playwright@1.56.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          pip3 install -q pillow >/dev/null 2>&1 || python3 -m pip install -q pillow
      - name: Render
        if: steps.req.outputs.count != '0'
        run: |
          set -e
          for f in /tmp/req/*.json; do
            out=$(node -pe 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).out' "$f")
            bg_url=$(node -pe 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).bg_url||""' "$f")
            mode=$(node -pe 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).mode||"thumb"' "$f")
            mkdir -p "$(dirname "$out")"; bg=""
            if [ "$mode" = "photo" ]; then
              # 본문 사진: 합성 없이 내려받아 폭 1200px JPEG(q85)로 저장
              curl -sSL --retry 3 -o /tmp/photo_src "$bg_url" || { echo "photo download failed for $out"; continue; }
              OUT="$out" python3 -c 'import os;from PIL import Image;im=Image.open("/tmp/photo_src").convert("RGB");w,h=im.size;im=im.resize((1200,int(h*1200/w)),Image.LANCZOS) if w>1200 else im;im.save(os.environ["OUT"],"JPEG",quality=85,optimize=True);print("photo",os.environ["OUT"],im.size)'
              git add "$out"; continue
            fi
            if [ -n "$bg_url" ]; then bg="${out%.png}_bg.jpg"; curl -sSL --retry 3 -o "$bg" "$bg_url" || { echo "bg download failed for $out"; bg=""; }; fi
            REQ="$f" OUT="$out" BG="$bg" node -e '
              const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.env.REQ,"utf8"));
              const spec=Object.assign({},r.spec||{});spec.out=process.env.OUT;if(process.env.BG)spec.bg=process.env.BG;
              fs.writeFileSync("/tmp/spec.json",JSON.stringify(spec));'
            node pipeline/cloud_thumb.cjs /tmp/spec.json
            git add "$out" ${bg:+"$bg"}
          done
          if [ "${{ github.event_name }}" = "push" ]; then
            mkdir -p thumb_requests/done && git mv -k thumb_requests/*.json thumb_requests/done/ 2>/dev/null || true
            git add -A thumb_requests
          fi
      - name: Commit
        if: steps.req.outputs.count != '0'
        run: |
          git config user.email "actions@github.com"; git config user.name "thumb-bot"
          git commit -m "thumb: rendered ${{ steps.req.outputs.count }} request(s) [skip ci]" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4; do git pull --rebase origin master && git push origin HEAD:master && break || sleep $((2**i)); done
